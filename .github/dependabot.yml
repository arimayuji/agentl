version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    cooldown:   # let a new release age a week before proposing it
      default-days: 7
    groups:
      python:
        patterns: ["*"]
  - package-ecosystem: pip
    directory: /requirements   # hash-locked tools of the release workflow
    schedule:
      interval: weekly
    cooldown:   # let a new release age a week before proposing it
      default-days: 7
    groups:
      release-tools:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:   # let a new release age a week before proposing it
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
