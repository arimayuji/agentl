name: Release Drafter

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-drafter
  cancel-in-progress: false

jobs:
  # Updates the draft release notes after each merge. It never publishes: publishing stays a
  # manual maintainer step on a v* tag (release.yml).
  draft:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: release-drafter/release-drafter@978bb0b30c5ee8cdd332ced253758157150d43f0  # v7.10.0
        with:
          publish: false
