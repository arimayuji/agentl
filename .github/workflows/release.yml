name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:  # "Run workflow" button, e.g. from a phone: creates the tag and the release itself
    inputs:
      version:
        description: "Version to release, without the v (must match agentl/__init__.py), e.g. 0.7.0"
        required: true

permissions:
  contents: read

env:
  TAG: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}

jobs:
  build:
    # Releases come from a v* tag, or from "Run workflow" on main only (not from any other branch).
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write      # signs the build provenance attestation (Sigstore)
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"
      - name: Check tag matches package version
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([a-z0-9.+-]*)?$ ]] || { echo "invalid version: $TAG"; exit 1; }
          pkg=$(python -c "import re;print(re.search(r'__version__ = \"(.+)\"', open('agentl/__init__.py').read())[1])")
          test "v$pkg" = "$TAG" || { echo "tag $TAG != version $pkg"; exit 1; }
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] && git ls-remote --exit-code --tags origin "$TAG" >/dev/null; then
            echo "$TAG already exists: push the tag to release it, or pick a new version"; exit 1
          fi
      - run: pip install --require-hashes -r requirements/release.txt  # build tools, pinned by hash
      - run: python -m build
      - name: SBOM (CycloneDX) of the installed wheel and its runtime dependencies
        run: |
          python -m venv /tmp/sbom-env
          /tmp/sbom-env/bin/pip install dist/*.whl
          mkdir -p sbom
          cyclonedx-py environment /tmp/sbom-env/bin/python --of JSON -o "sbom/agentl-etl-${TAG}.cdx.json"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        id: attest
        with:
          subject-path: "dist/*"
      - name: Keep the signed provenance with the release files
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        # The bundle wraps the signed SLSA provenance (in-toto statement): attach it under both names,
        # .sigstore.json for `gh attestation verify --bundle` and .intoto.jsonl for SLSA tooling.
        run: |
          cp "$BUNDLE" "sbom/agentl-etl-${TAG}.sigstore.json"
          jq -c . "$BUNDLE" > "sbom/agentl-etl-${TAG}.intoto.jsonl"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: dist
          path: dist/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: sbom
          path: sbom/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/agentl-etl
    permissions:
      contents: read
      id-token: write  # PyPI trusted publishing, no API token stored
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: sbom
          path: sbom/
      - env:
          GH_TOKEN: ${{ github.token }}
        # A release created by hand on github.com (e.g. from a phone) already exists: then only attach the files.
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* sbom/* --repo "$GITHUB_REPOSITORY" --clobber
            # a draft (e.g. from Release Drafter) has no tag yet: publish it on the commit that was built
            if [ "$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" = true ]; then
              gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --target "$GITHUB_SHA"
            fi
          else
            # on a tag push the tag exists; from "Run workflow" this creates it on the commit that was built
            gh release create "$TAG" dist/* sbom/* --repo "$GITHUB_REPOSITORY" --title "$TAG" --generate-notes --target "$GITHUB_SHA"
          fi
