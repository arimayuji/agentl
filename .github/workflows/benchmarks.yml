name: Benchmarks

on:
  push:
    tags: ["v*"]
    branches: [main]
    paths: ["agentl/**", "benchmarks/**", "pyproject.toml", ".github/workflows/benchmarks.yml"]
  pull_request:
    paths: ["agentl/**", "benchmarks/**", "pyproject.toml", ".github/workflows/benchmarks.yml"]
  workflow_dispatch:

concurrency:
  group: benchmarks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Fails the pull request when its agentl got slower or heavier than the base branch's, both measured
  # on this runner, alternating run by run, so the machine is the same for both (#157).
  perf-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
      # The agentl to compare with: the pull request's base, or the previous commit on a push.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.base.sha || github.event.before || 'main' }}
          path: base
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      # agentl's extras, plus the libraries the comparison measures it against
      - run: pip install -e ".[pandas,parquet]" requests httpx beautifulsoup4 lxml
      - run: python -m benchmarks --compare --against base --json compare.json
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: perf-gate-${{ github.sha }}
          path: compare.json

  bench:
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e .
      - run: python -m benchmarks --quick --json benchmarks.json
      - run: python -m benchmarks --compare --quick --json compare.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: benchmarks-${{ github.sha }}
          path: |
            benchmarks.json
            compare.json
