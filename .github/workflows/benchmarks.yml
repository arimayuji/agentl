name: Benchmarks

on:
  push:
    tags: ["v*"]
    branches: [main]
    paths: ["agentl/**", "benchmarks/**", "pyproject.toml", ".github/workflows/benchmarks.yml"]
  pull_request:
    paths: ["agentl/**", "benchmarks/**", "pyproject.toml", ".github/workflows/benchmarks.yml"]
  workflow_dispatch:

concurrency:
  group: benchmarks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Fails the pull request when its agentl got slower or heavier than the base branch's, both measured
  # on this runner, alternating run by run, so the machine is the same for both (#157).
  perf-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      # The agentl to compare with: the pull request's base, or the previous commit on a push.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.base.sha || github.event.before || 'main' }}
          path: base
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"
          # No pip cache: these runs also fire on v* tags, and a cache written by another run
          # could poison them (zizmor cache-poisoning). The install is small.
      # agentl's extras, plus the libraries the comparison measures it against
      - run: pip install -e ".[pandas,parquet]" requests httpx beautifulsoup4 lxml
      - run: python -m benchmarks --compare --against base --json compare.json
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: perf-gate-${{ github.sha }}
          path: compare.json

  bench:
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"
          # No pip cache: these runs also fire on v* tags, and a cache written by another run
          # could poison them (zizmor cache-poisoning). The install is small.
      - run: pip install -e .
      - run: python -m benchmarks --quick --json benchmarks.json
      - run: python -m benchmarks --compare --quick --json compare.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: benchmarks-${{ github.sha }}
          path: |
            benchmarks.json
            compare.json
