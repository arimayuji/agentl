name: Bug report
description: Something does not work as documented.
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Please remove secrets and real data from anything you paste.

        Tip: `agentl report --pipeline pipeline.yaml` fills this form for you (secrets masked, nothing
        sent). Fixing it with an AI coding agent? See
        [CONTRIBUTING_AI.md](https://github.com/arimayuji/agentl/blob/main/.github/CONTRIBUTING_AI.md).
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you expected and what happened instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Minimal pipeline to reproduce
      description: The smallest YAML (and data sample) that shows the problem.
      render: yaml
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Output or traceback
      render: shell
  - type: input
    id: version
    attributes:
      label: agentl version
      placeholder: "python -c 'import agentl; print(agentl.__version__)'"
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Python version and OS
      placeholder: Python 3.12, Ubuntu 24.04
    validations:
      required: true
