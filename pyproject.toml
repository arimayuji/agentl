[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentl-etl"
dynamic = ["version"]
description = "Agentic ETL for Python: YAML pipelines where each step is a connector, a function or an LLM agent."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Yuji Arima" }]
keywords = [
  "etl", "elt", "data-pipeline", "data-engineering", "llm", "agents", "ai-agents", "agentic",
  "yaml", "pandas", "polars", "parquet", "arrow", "postgres", "pdf-extraction", "document-processing",
  "anthropic", "claude", "openai", "ollama", "bedrock", "mcp", "airflow", "workflow",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Database",
  "Topic :: Office/Business",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: System :: Distributed Computing",
  "Topic :: Text Processing",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Typing :: Typed",
]
dependencies = ["pyyaml>=6", "pydantic>=2.4"]

[project.optional-dependencies]
excel = ["openpyxl>=3.1"]
pdf = ["pypdf>=6.19"]
office = ["openpyxl>=3.1", "python-docx>=1.1"]
xls = ["xlrd>=2"]
parquet = ["pyarrow>=23.0.1"]
arrow = ["pyarrow>=23.0.1"]
postgres = ["psycopg[binary]>=3.1"]
pandas = ["pandas>=2"]
polars = ["polars>=1.20", "pyarrow>=23.0.1"]
remote = ["fsspec>=2026.6"]
s3 = ["fsspec>=2026.6", "s3fs>=2024.2"]
gcs = ["fsspec>=2026.6", "gcsfs>=2024.2"]
azure = ["fsspec>=2026.6", "adlfs>=2024.2"]
sftp = ["fsspec>=2026.6", "paramiko>=3.4"]
sql = ["sqlalchemy>=2"]
mysql = ["sqlalchemy>=2", "pymysql>=1.1"]
mssql = ["sqlalchemy>=2", "pymssql>=2.3"]
oracle = ["sqlalchemy>=2", "oracledb>=2"]
snowflake = ["snowflake-sqlalchemy>=1.6"]
bigquery = ["sqlalchemy-bigquery>=1.11"]
duckdb = ["duckdb-engine>=0.13", "duckdb>=1.1", "pyarrow>=23.0.1"]
aws = ["boto3>=1.28"]
crypto = ["cryptography>=42"]
browser = ["playwright>=1.40"]
web = ["trafilatura>=2"]
google = ["google-auth>=2.20", "requests>=2.33"]
kafka = ["confluent-kafka>=2.3"]
rabbitmq = ["pika>=1.3"]
pubsub = ["google-cloud-pubsub>=2.18"]
mqtt = ["paho-mqtt>=2.0"]
eventhubs = ["azure-eventhub>=5.11"]
otel = ["opentelemetry-api>=1.20"]
sentry = ["sentry-sdk>=2.8"]
celery = ["celery>=5.3"]
temporal = ["temporalio>=1.5"]
airflow = ["apache-airflow>=2.7"]
anthropic = ["anthropic>=0.70"]
all = ["openpyxl>=3.1", "pypdf>=6.19", "python-docx>=1.1", "xlrd>=2", "pyarrow>=23.0.1", "psycopg[binary]>=3.1", "pandas>=2", "fsspec>=2026.6", "s3fs>=2024.2", "sqlalchemy>=2", "anthropic>=0.70", "cryptography>=42", "paho-mqtt>=2.0", "azure-eventhub>=5.11", "duckdb>=1.1"]
docs = ["mkdocs>=1.6,<2", "mkdocs-material>=9.5,<10", "mkdocstrings[python]>=0.26"]
dev = ["pytest>=8", "hypothesis>=6.100", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.11", "types-PyYAML", "pre-commit>=3", "openpyxl>=3.1", "pypdf>=6.19", "python-docx>=1.1", "pyarrow>=23.0.1", "psycopg[binary]>=3.1", "pandas>=2", "polars>=1.20", "fsspec>=2026.6", "celery>=5.3", "temporalio>=1.5", "sqlalchemy>=2", "opentelemetry-sdk>=1.20", "sentry-sdk>=2.8", "boto3>=1.28", "cryptography>=42", "trafilatura>=2", "paho-mqtt>=2.0", "azure-eventhub>=5.11", "duckdb>=1.1"]

[project.scripts]
agentl = "agentl.cli:main"
agentl-etl = "agentl.cli:main"  # same command under the package name, so `uvx agentl-etl` works

[project.urls]
Homepage = "https://github.com/arimayuji/agentl"
Repository = "https://github.com/arimayuji/agentl"
Issues = "https://github.com/arimayuji/agentl/issues"
Changelog = "https://github.com/arimayuji/agentl/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["agentl"]

[tool.hatch.version]
path = "agentl/__init__.py"

[tool.hatch.build.targets.sdist]
include = ["agentl", "tests", "examples", "README.md", "CHANGELOG.md", "LICENSE"]

[tool.ruff]
line-length = 110
target-version = "py310"
extend-exclude = ["docs/cases.md"]  # code blocks there are `--8<--` snippet includes, not Python

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E741", "RUF001"]

[tool.ruff.lint.per-file-ignores]
"agentl/dashboard.py" = ["E501"]  # inline HTML page
"media/**" = ["E501"]  # asset scripts with inline SVG

[tool.mypy]
python_version = "3.10"
packages = ["agentl"]
ignore_missing_imports = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["agentl"]
omit = ["agentl/dashboard.py"]
