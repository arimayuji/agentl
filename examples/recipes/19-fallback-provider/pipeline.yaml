# When the main provider fails (outage, rate limit), the same call goes to the next one.
name: fallback-provider
llm:
  default:
    provider: anthropic
    model: claude-sonnet-4-5
    price: { input: 3, output: 15 }
    fallback: [backup]
  backup: { provider: openrouter, model: openai/gpt-4o-mini }
budget: { max_usd: 1 }
steps:
  - id: tickets
    use: csv.read
    with: { path: tickets.csv }
  - id: classify
    input: tickets
    agent: Classify the support ticket as bug, billing or account.
    output:
      category: str
  - id: save
    use: json.write
    input: classify
    with: { path: out/tickets.json }
