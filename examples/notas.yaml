# Runs offline with the "echo" provider. Switch to provider: anthropic
# (and export ANTHROPIC_API_KEY) to let a real model fill the agent step.
name: notas-fiscais
llm:
  provider: echo
  model: claude-opus-5-5

steps:
  - id: notas
    use: csv.read
    with: { path: examples/data/notas.csv }

  - id: clientes
    use: json.read
    with: { path: examples/data/clientes.json }

  - id: cruzar
    use: join
    input: [notas, clientes]
    with: { left: notas, right: clientes, on: cnpj, how: left }

  - id: classificar
    agent: >
      Classify the expense category of this invoice from its description
      and flag it for review if the client is unknown.
    input: cruzar
    output:
      numero: str
      cliente: str?
      categoria: str?
      revisar: bool?

  - id: salvar
    use: json.write
    input: classificar
    with: { path: out/notas.json }

notify:
  channels:
    console: {}
  rules:
    - on: [run.failed, item.rejected]
      to: [console]
