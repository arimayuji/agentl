site_name: agentl
site_url: https://agentl.com.br/
site_description: Agentic ETL for Python. YAML pipelines where each step is a connector, a function or an LLM agent.
repo_url: https://github.com/arimayuji/agentl
repo_name: arimayuji/agentl
edit_uri: edit/main/docs/
copyright: Copyright &copy; 2026 Yuji Arima. Released under the MIT License.

theme:
  name: material
  custom_dir: docs/overrides
  logo: assets/favicon.svg
  icon:
    repo: fontawesome/brands/github
  favicon: assets/favicon.svg
  font:
    text: Inter
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle: { icon: material/weather-night, name: Switch to dark mode }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle: { icon: material/weather-sunny, name: Switch to light mode }
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.tabs.sticky
    - announce.dismiss
    - navigation.footer
    - navigation.instant
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
    - toc.follow

extra_css:
  - assets/extra.css

extra_javascript:
  - assets/terminal.js
  - assets/clips.js
  - assets/site.js

nav:
  - Home: index.md
  - Docs:
      - Getting started: getting-started.md
      - Concepts: concepts.md
      - Connectors: connectors.md
      - Integrations: integrations.md
      - Cloud: cloud.md
      - Agent steps: agents.md
      - Data checks: checks.md
      - Notifications: notifications.md
      - CLI and dashboard: cli.md
      - Scheduling and orchestration: orchestration.md
      - Observability: observability.md
      - Performance: performance.md
      - Evals: evals.md
      - Before and after: cases.md
      - Extending: extending.md
      - Migrate from pandas: migrate-from-pandas.md
      - Use with AI agents: ai-agents.md
      - API reference: reference.md
  - Community:
      - Roadmap: roadmap.md
      - Contributing: community.md
      - Changelog: changelog.md

hooks:
  - tools/llms_txt.py

exclude_docs: |
  MAINTAINING.md

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            show_source: false
            show_root_heading: true
            heading_level: 3
            members_order: source

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc: { permalink: true }
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight: { anchor_linenums: true }
  - pymdownx.inlinehilite
  - pymdownx.snippets: { base_path: ["."], check_paths: true }
  - pymdownx.tabbed: { alternate_style: true }
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra:
  version_label: v0.6
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/arimayuji/agentl
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/agentl-etl/
